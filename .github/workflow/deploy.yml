name: Build and deploy knowledgebase

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "import_excel.py"
      - "import_gsheet.py"
      - "article_formatting.py"
      - "build.py"
  workflow_dispatch: {}
  schedule:
    # Re-checks the live Google Sheet every 30 minutes, even with no code
    # changes pushed - see README -> "Polling on a schedule".
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python3 build.py

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
