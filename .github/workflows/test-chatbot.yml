name: Test knowledgebase and chatbot

on:
  pull_request:
    paths:
      - "build.py"
      - "article_formatting.py"
      - "import_tally.py"
      - "import_excel.py"
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "knowledge-rush-prototype/**"
      - "Knowledge_rush_assets/**"
      - "knowledge-games.html"
      - ".github/workflows/test-chatbot.yml"
  push:
    branches: [main]
    paths:
      - "build.py"
      - "article_formatting.py"
      - "import_tally.py"
      - "import_excel.py"
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "knowledge-rush-prototype/**"
      - "Knowledge_rush_assets/**"
      - "knowledge-games.html"
      - ".github/workflows/test-chatbot.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Build site and chatbot index
        run: python build.py

  worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Knowledge Rush JavaScript syntax
        run: |
          node --input-type=module --check < knowledge-rush-prototype/knowledge-rush.js
          node --input-type=module --check < knowledge-rush-prototype/three-BnZyOd0w.js
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < worker/src/index.js
