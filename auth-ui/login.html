<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · VWG Brand Support</title><link rel="icon" type="image/png" sizes="64x64" href="__FAVICON__"><style>:root{color-scheme:dark;font-family:system-ui;background:#080d18;color:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#1a3150 0,transparent 55%),#080d18}.card{width:min(100%,440px);padding:34px;border:1px solid #ffffff20;border-radius:24px;background:#101a2b;box-shadow:0 24px 80px #0007}.brand{font-size:12px;letter-spacing:.18em;font-weight:800;color:#82d6ff}.mark{font-size:30px;margin:18px 0 4px}h1{margin:0 0 8px;font-size:27px}p{color:#aab7ca;line-height:1.55;margin:0 0 24px}label{display:block;font-size:13px;color:#cbd5e1;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #34445d;border-radius:11px;background:#0b1322;color:#fff;font:inherit}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#35b9ef,#76e0ce);color:#071321;font-weight:800;font-size:15px;cursor:pointer}.small{font-size:13px;margin-top:20px}.small a{color:#85d7ff;text-decoration:none}.message{min-height:22px;margin-top:15px;font-size:13px;color:#ffbc9c}.note{font-size:12px;color:#8494aa;margin-top:18px}@property --auth-glow-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes auth-neon-spin{to{--auth-glow-angle:360deg}}
input,textarea,select{border:1px solid transparent;background:linear-gradient(#0b1322,#0b1322) padding-box,conic-gradient(from var(--auth-glow-angle),#35b9ef,#8265ff,#76e0ce,#35b9ef) border-box;transition:box-shadow .2s ease,filter .2s ease}
input:hover,textarea:hover,select:hover{box-shadow:0 0 11px #35b9ef24}
input:focus,textarea:focus,select:focus{outline:none;animation:auth-neon-spin 2.4s linear infinite;box-shadow:0 0 0 1px #35b9ef55,0 0 16px #35b9ef45,0 0 28px #76e0ce25}
@media(prefers-reduced-motion:reduce){input:focus,textarea:focus,select:focus{animation:none;background:linear-gradient(#0b1322,#0b1322) padding-box,linear-gradient(110deg,#35b9ef,#76e0ce) border-box}}</style></head><body><main class="card"><div class="brand">VWG · BRAND SUPPORT</div><div class="mark">Welcome back</div><h1>Knowledge Base</h1><p>Sign in with your approved team account to continue.</p><form id="loginForm"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button id="submit" type="submit">Sign in</button><div class="message" id="message" role="status"></div></form><div class="small">New to the Knowledge Base? <a href="/signup">Request an account</a></div><div class="note">New registrations require administrator approval before access is granted.</div></main><script>const form=document.getElementById('loginForm'),message=document.getElementById('message'),submit=document.getElementById('submit');let next=new URLSearchParams(location.search).get('next')||'/';if(!next.startsWith('/')||next.startsWith('//')||next.includes('\\'))next='/';form.addEventListener('submit',async function(e){e.preventDefault();message.textContent='Signing in…';submit.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})}),d=await r.json();if(!r.ok){message.textContent=d.error||'Unable to sign in.';return;}location.href=d.user.mustChangePassword?'/change-password':(d.user.role==='admin'&&next==='/'?'/admin':next);}catch(e){message.textContent='The sign-in service could not be reached. Please try again.';}finally{submit.disabled=false;}});</script></body></html>
