<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · VWG Brand Support</title><link rel="icon" type="image/png" sizes="64x64" href="__FAVICON__"><style>:root{color-scheme:dark;font-family:system-ui;background:#080d18;color:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);padding:32px;border:1px solid #ffffff20;border-radius:22px;background:#101a2b}.brand{font-size:12px;letter-spacing:.18em;color:#82d6ff;font-weight:800}h1{margin:22px 0 8px}p{color:#aab7ca;line-height:1.5}label{display:block;margin:16px 0 7px;font-size:13px}input{width:100%;padding:13px;border:1px solid #34445d;border-radius:10px;background:#0b1322;color:white;font:inherit}button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:10px;background:#73dccc;color:#071321;font-weight:800;font-size:15px;cursor:pointer}.message{color:#ffbc9c;margin-top:15px;font-size:13px}@property --auth-glow-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes auth-neon-spin{to{--auth-glow-angle:360deg}}
input,textarea,select{border:1px solid transparent;background:linear-gradient(#0b1322,#0b1322) padding-box,conic-gradient(from var(--auth-glow-angle),#35b9ef,#8265ff,#76e0ce,#35b9ef) border-box;transition:box-shadow .2s ease,filter .2s ease}
input:hover,textarea:hover,select:hover{box-shadow:0 0 11px #35b9ef24}
input:focus,textarea:focus,select:focus{outline:none;animation:auth-neon-spin 2.4s linear infinite;box-shadow:0 0 0 1px #35b9ef55,0 0 16px #35b9ef45,0 0 28px #76e0ce25}
@media(prefers-reduced-motion:reduce){input:focus,textarea:focus,select:focus{animation:none;background:linear-gradient(#0b1322,#0b1322) padding-box,linear-gradient(110deg,#35b9ef,#76e0ce) border-box}}</style></head><body><main class="card"><div class="brand">VWG · BRAND SUPPORT</div><h1>Change password</h1><p>Choose a new password for your Knowledge Base account. Use at least 12 characters.</p><form id="form"><div id="currentWrap"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password"></div><label for="password">New password</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button>Update password</button><div class="message" id="message" aria-live="polite"></div></form></main><script>(async function(){const r=await fetch('/api/auth/me'),d=await r.json();if(!d.user){location.href='/login';return;}if(d.user.mustChangePassword)document.getElementById('currentWrap').hidden=true;})();document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,m=document.getElementById('message');if(p!==c){m.textContent='The passwords do not match.';return;}if(p.length<12){m.textContent='Use at least 12 characters.';return;}m.textContent='Updating…';const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:document.getElementById('currentPassword').value,password:p})}),d=await r.json();if(!r.ok){m.textContent=d.error||'Could not update password.';return;}location.href='/account';});</script></body></html>
