<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request access · VWG Brand Support</title><link rel="icon" type="image/png" sizes="64x64" href="__FAVICON__"><style>:root{color-scheme:dark;font-family:system-ui;background:#080d18;color:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#1a3150 0,transparent 55%),#080d18}.card{width:min(100%,480px);padding:34px;border:1px solid #ffffff20;border-radius:24px;background:#101a2b;box-shadow:0 24px 80px #0007}.brand{font-size:12px;letter-spacing:.18em;font-weight:800;color:#82d6ff}.mark{font-size:28px;margin:18px 0 4px}h1{margin:0 0 8px;font-size:25px}p{color:#aab7ca;line-height:1.55;margin:0 0 22px}label{display:block;font-size:13px;color:#cbd5e1;margin:15px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #34445d;border-radius:11px;background:#0b1322;color:#fff;font:inherit}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#35b9ef,#76e0ce);color:#071321;font-weight:800;font-size:15px;cursor:pointer}.small{font-size:13px;margin-top:20px;color:#aab7ca}.small a{color:#85d7ff;text-decoration:none}.message{min-height:26px;margin-top:15px;font-size:13px;color:#ffbc9c}.hint{font-size:12px;color:#8494aa;margin-top:7px;line-height:1.5}@property --auth-glow-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes auth-neon-spin{to{--auth-glow-angle:360deg}}
input,textarea,select{border:1px solid transparent;background:linear-gradient(#0b1322,#0b1322) padding-box,conic-gradient(from var(--auth-glow-angle),#35b9ef,#8265ff,#76e0ce,#35b9ef) border-box;transition:box-shadow .2s ease,filter .2s ease}
input:hover,textarea:hover,select:hover{box-shadow:0 0 11px #35b9ef24}
input:focus,textarea:focus,select:focus{outline:none;animation:auth-neon-spin 2.4s linear infinite;box-shadow:0 0 0 1px #35b9ef55,0 0 16px #35b9ef45,0 0 28px #76e0ce25}
@media(prefers-reduced-motion:reduce){input:focus,textarea:focus,select:focus{animation:none;background:linear-gradient(#0b1322,#0b1322) padding-box,linear-gradient(110deg,#35b9ef,#76e0ce) border-box}}input[type=checkbox]{width:auto;accent-color:#35b9ef}.checkline{display:flex;align-items:center;gap:8px;margin:10px 0;color:#aab7ca;font-size:12px}.checkline input{margin:0}</style></head><body><main class="card"><div class="brand">VWG · BRAND SUPPORT</div><div class="mark">Join the team</div><h1>Request an account</h1><p>Create your login details. Your account will stay pending until an administrator approves it.</p><form id="signupForm"><label for="name">Full name</label><input id="name" autocomplete="name" required maxlength="80"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Create password</label><input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><div class="hint">Use at least 12 characters. Do not reuse your work or personal account password.</div><label for="confirmPassword">Re-enter password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label class="checkline"><input id="showPassword" type="checkbox"> Show passwords</label><button id="submit" type="submit">Submit registration</button><div class="message" id="message" role="status"></div></form><div class="small">Already registered? <a href="/login">Return to sign in</a></div></main><script>const form=document.getElementById('signupForm'),message=document.getElementById('message'),submit=document.getElementById('submit');document.getElementById('showPassword').addEventListener('change',e=>{const type=e.target.checked?'text':'password';document.getElementById('password').type=type;document.getElementById('confirmPassword').type=type;});form.addEventListener('submit',async function(e){e.preventDefault();if(document.getElementById('password').value!==document.getElementById('confirmPassword').value){message.textContent='The passwords do not match.';return;}message.textContent='Creating your account…';submit.disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value,confirmPassword:document.getElementById('confirmPassword').value})}),d=await r.json();if(!r.ok){message.textContent=d.error||'Registration could not be completed.';return;}form.reset();message.textContent=d.status==='active'?'Administrator account created. You can now sign in.':'Registration received. An administrator must approve your account before you can sign in.';}catch(e){message.textContent='The registration service could not be reached. Please try again.';}finally{submit.disabled=false;}});</script></body></html>
