<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account · VWG Brand Support</title><link rel="icon" type="image/png" sizes="64x64" href="__FAVICON__"><style>:root{color-scheme:dark;font-family:system-ui;background:#080d18;color:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);padding:32px;border:1px solid #ffffff20;border-radius:22px;background:#101a2b}.brand{font-size:12px;letter-spacing:.18em;color:#82d6ff;font-weight:800}h1{margin:22px 0 8px}.muted{color:#aab7ca}.row{padding:13px 0;border-bottom:1px solid #ffffff16}.label{display:block;color:#8193aa;font-size:12px;margin-bottom:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.button{display:inline-block;padding:12px 15px;border-radius:10px;background:#73dccc;color:#071321;font-weight:750;text-decoration:none;border:0;cursor:pointer;font-size:14px}.secondary{background:#263750;color:#eef6ff}@property --auth-glow-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes auth-neon-spin{to{--auth-glow-angle:360deg}}
input,textarea,select{border:1px solid transparent;background:linear-gradient(#0b1322,#0b1322) padding-box,conic-gradient(from var(--auth-glow-angle),#35b9ef,#8265ff,#76e0ce,#35b9ef) border-box;transition:box-shadow .2s ease,filter .2s ease}
input:hover,textarea:hover,select:hover{box-shadow:0 0 11px #35b9ef24}
input:focus,textarea:focus,select:focus{outline:none;animation:auth-neon-spin 2.4s linear infinite;box-shadow:0 0 0 1px #35b9ef55,0 0 16px #35b9ef45,0 0 28px #76e0ce25}
@media(prefers-reduced-motion:reduce){input:focus,textarea:focus,select:focus{animation:none;background:linear-gradient(#0b1322,#0b1322) padding-box,linear-gradient(110deg,#35b9ef,#76e0ce) border-box}}</style></head><body><main class="card"><div class="brand">VWG · BRAND SUPPORT</div><h1>Your account</h1><p class="muted">You are signed in to the Knowledge Base.</p><div class="row"><span class="label">Name</span><strong id="name">Loading…</strong></div><div class="row"><span class="label">Email</span><strong id="email"></strong></div><div class="row"><span class="label">Access level</span><strong id="role"></strong></div><div class="actions"><a class="button" href="/">Open Knowledge Base</a><a class="button secondary" href="/#/favorites">Favorite articles</a><a class="button secondary" id="admin" href="/admin" hidden>Admin dashboard</a><a class="button secondary" href="/change-password">Change password</a><button id="logout" class="button secondary">Sign out</button></div><p id="message" class="muted" aria-live="polite"></p></main><script>(async function(){const r=await fetch('/api/auth/me'),d=await r.json();if(!r.ok||!d.user){location.href='/login';return;}document.getElementById('name').textContent=d.user.name;document.getElementById('email').textContent=d.user.email;document.getElementById('role').textContent=d.user.role;if(d.user.role==='admin')document.getElementById('admin').hidden=false;})();document.getElementById('logout').addEventListener('click',async function(){const r=await fetch('/api/auth/logout',{method:'POST'});if(r.ok)location.href='/login';else document.getElementById('message').textContent='Could not sign out. Please retry.';});</script></body></html>
