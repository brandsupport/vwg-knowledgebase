<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account · VWG Brand Support</title><link rel="icon" type="image/png" sizes="64x64" href="__FAVICON__">
<style>
:root{color-scheme:dark;font-family:system-ui;background:#080d18;color:#f4f6fb}
*{box-sizing:border-box}
[hidden]{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#1a3150 0,transparent 55%),#080d18}
.card{width:min(100%,560px);padding:30px;border:1px solid #ffffff20;border-radius:22px;background:#101a2b;box-shadow:0 22px 70px #0005}
.brand{font-size:12px;letter-spacing:.18em;color:#82d6ff;font-weight:800}h1{margin:20px 0 8px}.muted{color:#aab7ca}
.row{padding:13px 0;border-bottom:1px solid #ffffff16}.label{display:block;color:#8193aa;font-size:12px;margin-bottom:4px}
.avatar-top{display:flex;align-items:center;gap:15px;margin:20px 0 12px}.avatar-current{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;font-size:38px;background:linear-gradient(145deg,#16364b,#34244c);border:1px solid #ffffff28}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:9px;margin:14px 0;max-height:380px;overflow:auto;padding:4px}
.avatar-choice{aspect-ratio:1;border:1px solid #34445d;border-radius:14px;background:#0b1525;color:#fff;font-size:26px;cursor:pointer;transition:.18s ease}
.avatar-choice:hover{border-color:#35b9ef;box-shadow:0 0 15px #35b9ef35;transform:translateY(-1px)}
.avatar-choice.selected{border-color:#76e0ce;background:linear-gradient(145deg,#16455a,#3a2854);box-shadow:0 0 0 2px #35b9ef55,0 0 19px #35b9ef28}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;min-width:0}.actions>*{flex:1 1 150px;min-width:0;text-align:center;white-space:normal}
.button{display:inline-block;padding:12px 15px;border-radius:10px;background:linear-gradient(115deg,#35b9ef,#76e0ce);color:#071321;font-weight:750;text-decoration:none;border:0;cursor:pointer;font-size:14px}
.secondary{background:#263750;color:#eef6ff}.button:disabled{opacity:.55;cursor:wait}
.message{min-height:22px;margin-top:12px;color:#9fe6d8;font-size:13px}
@media(max-width:480px){.card{padding:22px 18px}.avatar-grid{grid-template-columns:repeat(6,minmax(0,1fr));max-height:340px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main class="card"><div class="brand">VWG · BRAND SUPPORT</div><h1>Your profile</h1><p class="muted">Personalise your Knowledge Base profile. Your selected avatar appears beside your profile throughout the Knowledge Base.</p>
<div class="avatar-top"><div class="avatar-current" id="avatarPreview" aria-hidden="true">👤</div><div><strong id="name">Loading…</strong><div class="muted" id="email"></div></div></div>
<div class="label">Choose your avatar</div><div class="avatar-grid" id="avatarGrid" aria-label="Choose a profile avatar"></div>
<button id="saveAvatar" class="button" type="button">Save avatar</button>
<div class="row"><span class="label">Access level</span><strong id="role"></strong></div>
<div class="actions"><a class="button" href="/">Open Knowledge Base</a><a class="button secondary" href="/#/favorites">Favorite articles</a><a class="button secondary" id="admin" href="/admin" hidden>Admin dashboard</a><a class="button secondary" href="/change-password">Change password</a><button id="logout" class="button secondary" type="button">Sign out</button></div>
<p id="message" class="message" aria-live="polite"></p></main>
<script>
const AVATARS=["👤","🦁","🐼","🦊","🐺","🐸","🐧","🐯","🐨","🦉","🐙","🐬","🦭","🦄","🐻","🐮","🐵","🐹","🐰","🦝","🦓","🦒","🐘","🦛","🦔","🐢","🐳","🦈","🦋","🐝","🐞","🐲","🐉","🦖","🦕","🦜","🦩","🦚","🐦","🐱","🐶","🐴","🐭","🦇","🦦","🦥","🦨","🦡","🦫","🦢","🦤","🚗","🚙","🏎️","🚕","🚓","🚑","🚌","🚚","🚀","🌟","🔥","⚡","🎯","🎮","🧠","🛠️","🌈","💎","🎧","🏁"];
let selectedAvatar='👤';
const grid=document.getElementById('avatarGrid'),preview=document.getElementById('avatarPreview'),message=document.getElementById('message'),save=document.getElementById('saveAvatar');
function renderAvatars(){
  grid.replaceChildren();
  AVATARS.forEach((avatar,index)=>{
    const button=document.createElement('button');button.type='button';button.className='avatar-choice'+(avatar===selectedAvatar?' selected':'');button.textContent=avatar;button.title='Avatar '+(index+1);button.setAttribute('aria-label','Choose avatar '+(index+1));button.setAttribute('aria-pressed',String(avatar===selectedAvatar));
    button.addEventListener('click',()=>{selectedAvatar=avatar;preview.textContent=avatar;renderAvatars();message.textContent='Avatar selected. Save to apply it to your profile.';});
    grid.append(button);
  });
}
(async function(){
  try{
    const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}),d=await r.json();
    if(!r.ok||!d.user){location.href='/login';return;}
    document.getElementById('name').textContent=d.user.name;document.getElementById('email').textContent=d.user.email;document.getElementById('role').textContent=d.user.role;
    if(d.user.role==='admin')document.getElementById('admin').hidden=false;
    selectedAvatar=d.user.avatar||'👤';preview.textContent=selectedAvatar;renderAvatars();
  }catch(e){message.textContent='Could not load your profile. Refresh and try again.';}
})();
save.addEventListener('click',async()=>{
  save.disabled=true;message.textContent='Saving avatar…';
  try{
    const r=await fetch('/api/auth/profile',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar:selectedAvatar})}),d=await r.json();
    if(!r.ok)throw new Error(d.error||'Could not save your avatar.');
    preview.textContent=d.user.avatar;selectedAvatar=d.user.avatar;renderAvatars();message.textContent='Avatar saved. It will now appear throughout the Knowledge Base.';
  }catch(e){message.textContent=e.message||'Could not save your avatar.';}
  finally{save.disabled=false;}
});
document.getElementById('logout').addEventListener('click',async function(){const r=await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});if(r.ok)location.href='/login';else message.textContent='Could not sign out. Please retry.';});
</script></body></html>
